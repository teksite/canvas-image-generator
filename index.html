<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>جدول روی تصویر</title>
    <style>
        body {
            font-family: Arial, Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        label { margin-top: 10px; font-weight: bold; }
        input { width: 300px; padding: 5px; margin-bottom: 10px; text-align: right; }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #45a049; }
        #setupBox {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff3cd;
            border: 1px solid #ffe08a;
            padding: 10px 20px;
            margin-bottom: 15px;
        }
        #resetLink { font-size: 12px; color: #888; cursor: pointer; margin-top: 8px; display: none; }
        canvas { margin-top: 20px; border: 1px solid #ccc; max-width: 100%; height: auto; }
    </style>
</head>
<body>

<div id="setupBox">
    <label for="bgInput">فقط یک بار: فایل bg.jpg را انتخاب کنید</label>
    <input type="file" id="bgInput" accept="image/*">
</div>

<label for="customerInput">مشتری</label>
<input id="customerInput" placeholder="نام مشتری خود را وارد کنید...">
<label for="subjectInput">موضوع</label>
<input id="subjectInput" placeholder="موضوع خود را وارد کنید...">
<label for="presenterInput">ارائه‌دهنده</label>
<input id="presenterInput" placeholder="ارائه‌دهنده را وارد کنید...">
<label for="dateInput">تاریخ</label>
<input id="dateInput" placeholder="تاریخ را وارد کنید...">
<label for="timeInput">زمان</label>
<input id="timeInput" placeholder="زمان را وارد کنید...">
<label for="typeInput">نوع جلسه</label>
<input id="typeInput" placeholder="نوع جلسه را وارد کنید...">
<label for="addressInput">آدرس</label>
<input id="addressInput" placeholder="آدرس را وارد کنید...">
<label for="personsInput">حاضرین در جلسه</label>
<input id="personsInput" placeholder="افراد را وارد کنید...">

<button onclick="generateImage()">تولید و دانلود تصویر</button>
<span id="resetLink" onclick="resetBg()">تغییر تصویر پس‌زمینه</span>
<canvas id="canvas" style="display: none;"></canvas>

<script>
    const FONT_FAMILY = '"B Nazanin", Vazirmatn, Tahoma, Arial, sans-serif';
    let bgBlob = null; 

    function openDB() {
        return new Promise((resolve, reject) => {
            const r = indexedDB.open('meetingImageDB', 1);
            r.onupgradeneeded = () => r.result.createObjectStore('store');
            r.onsuccess = () => resolve(r.result);
            r.onerror = () => reject(r.error);
        });
    }
    async function saveBg(blob) {
        try {
            const db = await openDB();
            await new Promise((resolve, reject) => {
                const t = db.transaction('store', 'readwrite');
                t.objectStore('store').put(blob, 'bg');
                t.oncomplete = resolve;
                t.onerror = () => reject(t.error);
            });
        } catch (e) { console.warn('ذخیره‌سازی ممکن نشد', e); }
    }
    async function readBg() {
        try {
            const db = await openDB();
            return await new Promise((resolve, reject) => {
                const t = db.transaction('store', 'readonly');
                const q = t.objectStore('store').get('bg');
                q.onsuccess = () => resolve(q.result || null);
                q.onerror = () => reject(q.error);
            });
        } catch (e) { return null; }
    }
    async function clearBg() {
        try {
            const db = await openDB();
            db.transaction('store', 'readwrite').objectStore('store').delete('bg');
        } catch (e) {}
    }

    function updateUI() {
        document.getElementById('setupBox').style.display = bgBlob ? 'none' : 'flex';
        document.getElementById('resetLink').style.display = bgBlob ? 'inline' : 'none';
    }

    document.getElementById('bgInput').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;
        bgBlob = file;
        await saveBg(file);
        updateUI();
    });

    async function resetBg() {
        bgBlob = null;
        await clearBg();
        document.getElementById('bgInput').value = '';
        updateUI();
    }

    (async () => {
        bgBlob = await readBg();
        updateUI();
    })();

    function loadBackground() {
        return new Promise((resolve) => {
            if (!bgBlob) return resolve(null);
            const img = new Image();
            img.onload = () => resolve(img);
            img.onerror = () => resolve(null);
            img.src = URL.createObjectURL(bgBlob);
        });
    }

    function wrapText(ctx, text, maxWidth) {
        const words = String(text).split(' ');
        const lines = [];
        let line = '';
        for (const word of words) {
            const test = line ? line + ' ' + word : word;
            if (ctx.measureText(test).width > maxWidth && line) {
                lines.push(line);
                line = word;
            } else {
                line = test;
            }
        }
        if (line) lines.push(line);
        return lines.length ? lines : [''];
    }

    async function generateImage() {
        const customerTitle = document.getElementById('customerInput').value || 'مشتری';

        const inputs = [
            { label: 'موضوع', value: document.getElementById('subjectInput').value || 'موضوع نمونه' },
            { label: 'ارائه‌دهنده', value: document.getElementById('presenterInput').value || 'علی محمدی' },
            { label: 'تاریخ', value: document.getElementById('dateInput').value || '1404-02-02' },
            { label: 'زمان', value: document.getElementById('timeInput').value || '10:00 صبح' },
            { label: 'نوع جلسه', value: document.getElementById('typeInput').value || 'نوع جلسه' },
            { label: 'آدرس', value: document.getElementById('addressInput').value || 'خیابان اصلی' },
            { label: 'حاضرین در جلسه', value: document.getElementById('personsInput').value || 'حاضرین در جلسه' }
        ];

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        const img = await loadBackground();
        canvas.width = img ? img.naturalWidth : 900;
        canvas.height = img ? img.naturalHeight : 680;

        if (img) {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = '#f0f0f0';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const cellPadding = 20;
        const gap = 20;
        const tableWidth = canvas.width * 0.9;
        const tableHeight = canvas.height * 0.9;
        const tableX = (canvas.width - tableWidth) / 2;
        const tableY = (canvas.height - tableHeight) / 2;

        ctx.textBaseline = 'middle';
        ctx.direction = 'rtl';

        const title = `اطلاعات برگزاری جلسه با ${customerTitle}`;

        function layout(fontSize) {
            ctx.font = `${fontSize}px ${FONT_FAMILY}`;
            const lineHeight = fontSize * 1.6;
            const rowGap = fontSize * 0.4;

            const titleLines = wrapText(ctx, title, tableWidth - 2 * cellPadding);
            const labelsWrapped = inputs.map(r => wrapText(ctx, r.label, tableWidth * 0.35));
            const col1Width = Math.max(...labelsWrapped.flat().map(l => ctx.measureText(l).width));
            const valueMax = tableWidth - 2 * cellPadding - col1Width - gap;
            const valuesWrapped = inputs.map(r => wrapText(ctx, r.value, valueMax));

            const rowHeights = inputs.map((_, i) =>
                Math.max(labelsWrapped[i].length, valuesWrapped[i].length) * lineHeight + rowGap
            );
            const titleHeight = titleLines.length * lineHeight + rowGap * 2;
            const total = titleHeight + rowHeights.reduce((a, b) => a + b, 0);

            return { fontSize, lineHeight, titleLines, titleHeight, labelsWrapped,
                     valuesWrapped, rowHeights, col1Width, total };
        }

        let L = layout(28);
        for (let fs = 28; fs >= 12; fs--) {
            L = layout(fs);
            if (L.total <= tableHeight - 2 * cellPadding) break;
        }

        ctx.fillStyle = 'rgba(5, 5, 45, 0.80)';
        ctx.fillRect(tableX, tableY, tableWidth, tableHeight);

        ctx.font = `${L.fontSize}px ${FONT_FAMILY}`;
        ctx.fillStyle = 'white';
        ctx.strokeStyle = 'black';
        ctx.lineWidth = 1;

        let y = tableY + (tableHeight - L.total) / 2;

        ctx.textAlign = 'center';
        L.titleLines.forEach((line, i) => {
            const ly = y + L.fontSize * 0.4 + (i + 0.5) * L.lineHeight;
            ctx.strokeText(line, tableX + tableWidth / 2, ly);
            ctx.fillText(line, tableX + tableWidth / 2, ly);
        });
        y += L.titleHeight;

        const labelX = tableX + tableWidth - cellPadding;
        const valueX = labelX - L.col1Width - gap;
        ctx.textAlign = 'right';

        inputs.forEach((_, i) => {
            const rowTop = y;
            L.labelsWrapped[i].forEach((line, j) => {
                const ly = rowTop + (j + 0.5) * L.lineHeight;
                ctx.strokeText(line, labelX, ly);
                ctx.fillText(line, labelX, ly);
            });
            L.valuesWrapped[i].forEach((line, j) => {
                const ly = rowTop + (j + 0.5) * L.lineHeight;
                ctx.strokeText(line, valueX, ly);
                ctx.fillText(line, valueX, ly);
            });
            y += L.rowHeights[i];
        });

        canvas.style.display = 'block';

        canvas.toBlob((blob) => {
            if (!blob) { alert('خطا در ساخت تصویر'); return; }
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'text-on-image.png';
            document.body.appendChild(a);
            a.click();
            a.remove();
            URL.revokeObjectURL(url);
        }, 'image/png');
    }
</script>
</body>
</html>
